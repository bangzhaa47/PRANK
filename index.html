<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mau Lihat Apa? 💀</title>
    <style>
        body {
            background-color: #ffffff; /* Background putih bersih */
            color: #000000; /* Teks warna hitam */
            font-family: 'Courier New', Courier, monospace, sans-serif;
            text-align: center;
            padding-top: 60px;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            color: #000000;
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            animation: shake 0.5s infinite alternate;
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            100% { transform: translateX(5px); }
        }
        .gif-container {
            margin: 20px auto;
        }
        .gif-container img {
            width: 260px;
            max-width: 80%;
            border: 4px solid #000000; /* Bingkai hitam putih gaya brutalist/retro */
            border-radius: 12px;
            box-shadow: 8px 8px 0px #000000; /* Efek shadow kotak hitam solid */
            animation: bounce 1.2s infinite alternate;
        }
        @keyframes bounce {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-10px) rotate(3deg); }
        }
        .hashtag-box {
            margin-top: 40px;
            display: inline-block;
        }
        .hashtag {
            font-weight: bold;
            color: #ffffff;
            background-color: #000000; /* Kotak hitam dengan teks putih */
            font-size: 1.2rem;
            padding: 12px 24px;
            border-radius: 8px;
            letter-spacing: 1px;
            box-shadow: 4px 4px 0px #555555;
        }
    </style>
</head>
<body>

    <h1>Mau liat apa? Weh kena juga kan!</h1>
    
    <div class="gif-container">
        <!-- Memuat file GIF dari folder yang sama -->
        <img src="https://github.com/bangzhaa47/PRANK/foto2.gif" alt="Prank GIF">
    </div>

    <div class="hashtag-box">
        <div class="hashtag">#by KENTUT.BERKUAH</div>
    </div>

</body>
</html>
