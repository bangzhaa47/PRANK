<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prank!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            cursor: pointer; /* Indikator bahwa halaman bisa diklik untuk memutar suara */
        }

        .container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Ukuran GIF dibuat sekitar separuh layar */
        .gif-container img {
            max-width: 80vw;
            max-height: 50vh;
            width: auto;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }

        .text-main {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff4757;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            line-height: 1.4;
        }

        /* Ukuran hashtag dibuat lebih kecil */
        .hashtag {
            font-size: 0.9rem;
            color: #a4b0be;
            font-style: italic;
            letter-spacing: 1px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Audio Element untuk Backsound -->
    <!-- Catatan: Sesuaikan nama file 'backsound.mp3' jika nama file di repo Anda berbeda -->
    <audio id="bg-audio" loop>
        <source src="https://raw.githubusercontent.com/bangzhaa47/PRANK/main/lawak.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <div class="container">
        <!-- Teks Utama Prank -->
        <div class="text-main">
            Mau liat apa? Kena juga kan lo! 🤪
        </div>

        <!-- Foto GIF (Ukuran ~separuh layar) -->
        <div class="gif-container">
            <img src="https://raw.githubusercontent.com/bangzhaa47/PRANK/main/foto2.gif" alt="Prank GIF">
        </div>

        <!-- Hashtag Ukuran Kecil -->
        <div class="hashtag">
            #by KENTUT.BERKUAH
        </div>
    </div>

    <script>
        const audio = document.getElementById('bg-audio');

        // Kebijakan browser modern memblokir autoplay audio tanpa interaksi pengguna.
        // Script ini akan langsung memutar suara begitu pengguna mengeklik/mengetuk di mana saja pada layar.
        function playAudio() {
            audio.play().then(() => {
                console.log("Audio berhasil diputar!");
            }).catch(error => {
                console.log("Menunggu interaksi pengguna untuk memutar audio.");
            });
            // Hapus event listener setelah pertama kali diklik agar tidak dipanggil berulang
            document.removeEventListener('click', playAudio);
            document.removeEventListener('touchstart', playAudio);
        }

        // Coba putar otomatis langsung
        audio.play().catch(() => {
            // Jika diblokir oleh browser, putar saat ada interaksi pertama
            document.addEventListener('click', playAudio);
            document.addEventListener('touchstart', playAudio);
        });
    </script>

</body>
</html>
