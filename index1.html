<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Hadiah Buat Kamu!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Tombol Kado dibuat bersih tanpa background bawaan agar murni gambar */
        .gift-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: transform 0.2s ease;
        }

        .gift-btn:active {
            transform: scale(0.95);
        }

        /* Styling Gambar (Kado / Prank) */
        .media-container img {
            max-width: 80vw;
            max-height: 50vh;
            width: auto;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }

        .text-main {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff4757;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            line-height: 1.4;
            display: none;
        }

        .instruction {
            font-size: 1.2rem;
            color: #2ed573;
            font-weight: bold;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .hashtag {
            font-size: 0.9rem;
            color: #a4b0be;
            font-style: italic;
            letter-spacing: 1px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Audio Element untuk Backsound -->
    <audio id="bg-audio" loop preload="auto">
        <source src="https://raw.githubusercontent.com/bangzhaa47/PRANK/main/lawak.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <div class="container">
        <!-- Teks Instruksi Kado -->
        <div class="instruction" id="instruction-text">🎁 Yeay! Kamu dapat hadiah spesial, klik kadonya!</div>

        <!-- Teks Utama Prank (Muncul setelah diklik) -->
        <div class="text-main" id="prank-text">
            Mau liat apa? Kena juga kan lo! 🤪
        </div>

        <!-- Tombol Kado Asli (Memicu interaksi murni pengguna) -->
        <button class="gift-btn" id="gift-button" onclick="openGift()">
            <div class="media-container">
                <img id="prank-image" src="https://raw.githubusercontent.com/bangzhaa47/PRANK/main/foto1.gif" alt="Kotak Kado">
            </div>
        </button>

        <!-- Hashtag (Muncul setelah diklik) -->
        <div class="hashtag" id="hashtag-text">
            #by KENTUT.BERKUAH
        </div>
    </div>

    <script>
        const audio = document.getElementById('bg-audio');
        const prankImage = document.getElementById('prank-image');
        const prankText = document.getElementById('prank-text');
        const instructionText = document.getElementById('instruction-text');
        const hashtagText = document.getElementById('hashtag-text');
        const giftButton = document.getElementById('gift-button');

        let isOpened = false;

        function openGift() {
            if (isOpened) return; 
            isOpened = true;

            // Memutar audio langsung di dalam event klik tombol asli
            audio.play().then(() => {
                console.log("Audio berhasil diputar!");
            }).catch(error => {
                console.log("Gagal memutar audio:", error);
                // Jika masih terblokir, kita hilangkan alert agar tidak mengganggu, 
                // tapi secara fungsi tombol asli ini lolos dari proteksi browser.
            });

            // Ubah gambar kado menjadi GIF Prank
            prankImage.src = "https://raw.githubusercontent.com/bangzhaa47/PRANK/main/foto2.gif";

            // Ubah teks
            instructionText.style.display = 'none';
            prankText.style.display = 'block';
            hashtagText.style.display = 'block';

            // Ubah cursor tombol jadi default karena sudah terbuka
            giftButton.style.cursor = 'default';
        }
    </script>

</body>
</html>
